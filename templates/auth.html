<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Roxen - Fresh Grocery Delivery</title>
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        /* Premium Light Mint Green Background */
        body {
            background: linear-gradient(180deg, #e4f4ec 0%, #d2edd9 100%);
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px;
        }

        /* Mobile-First App Card Container */
        .auth-card {
            width: 100%;
            max-width: 410px;
            background: #ffffff;
            border-radius: 32px;
            padding: 26px 22px 20px;
            box-shadow: 0 16px 40px rgba(13, 92, 58, 0.08), 0 2px 8px rgba(0,0,0,0.03);
            border: 1px solid rgba(255, 255, 255, 0.8);
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        @media (max-width: 440px) {
            body {
                padding: 0;
                align-items: flex-end;
            }
            .auth-card {
                max-width: 100%;
                border-bottom-left-radius: 0;
                border-bottom-right-radius: 0;
                border-top-left-radius: 32px;
                border-top-right-radius: 32px;
                min-height: 90dvh;
                padding: 24px 20px 22px;
            }
        }

        /* Dynamic Popup Toast */
        .toast-notify {
            position: absolute;
            top: 14px;
            left: 18px;
            right: 18px;
            padding: 11px 16px;
            border-radius: 14px;
            font-size: 12.5px;
            font-weight: 700;
            display: none;
            align-items: center;
            gap: 10px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
            z-index: 999;
            animation: popIn 0.25s ease-out;
        }
        @keyframes popIn {
            from { transform: translateY(-16px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .toast-notify.error {
            background: #fef2f2;
            color: #b91c1c;
            border: 1px solid #fecaca;
        }
        .toast-notify.success {
            background: #ecfdf5;
            color: #047857;
            border: 1px solid #a7f3d0;
        }

        /* Branding Header */
        .brand-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
        }
        .brand-logo {
            width: 42px;
            height: 42px;
            background: #e8f7ee;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            color: #0e8345;
        }
        .brand-info h2 {
            font-size: 20px;
            font-weight: 800;
            color: #0d5c3a;
            letter-spacing: -0.3px;
            line-height: 1.1;
        }
        .brand-info p {
            font-size: 9.5px;
            font-weight: 800;
            letter-spacing: 0.9px;
            color: #7b8a82;
            margin-top: 2px;
        }

        .badge-sub {
            font-size: 10.5px;
            font-weight: 800;
            letter-spacing: 1.1px;
            color: #0e8345;
            text-transform: uppercase;
            margin-bottom: 4px;
        }
        .title {
            font-size: 25px;
            font-weight: 800;
            color: #171d1b;
            letter-spacing: -0.5px;
            margin-bottom: 4px;
        }
        .desc {
            font-size: 13px;
            color: #6b7771;
            margin-bottom: 18px;
        }

        /* Pill Switcher */
        .segmented-control {
            background-color: #f1f5f3;
            padding: 4px;
            border-radius: 16px;
            display: flex;
            margin-bottom: 18px;
        }
        .seg-btn {
            flex: 1;
            border: none;
            background: transparent;
            padding: 10px 0;
            font-size: 13.5px;
            font-weight: 700;
            color: #66726c;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .seg-btn.active {
            background: #ffffff;
            color: #0d5c3a;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.06);
        }

        /* Forms Layout */
        .form-section { display: none; }
        .form-section.active { display: block; }
        .field-group { margin-bottom: 13px; }
        .field-group label {
            display: block;
            font-size: 10.5px;
            font-weight: 800;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            color: #4b5852;
            margin-bottom: 6px;
        }

        .input-box {
            position: relative;
            display: flex;
            align-items: center;
        }
        .input-box i.lead-icon {
            position: absolute;
            left: 14px;
            font-size: 19px;
            color: #8c9892;
        }
        .input-box input {
            width: 100%;
            height: 48px;
            background: #ffffff;
            border: 1.5px solid #e1e7e4;
            border-radius: 14px;
            padding: 0 42px 0 44px;
            font-size: 14px;
            font-weight: 500;
            color: #171d1b;
            outline: none;
            transition: border-color 0.2s;
        }
        .input-box input:focus {
            border-color: #0e8345;
            background: #fafdfb;
        }
        .input-box .toggle-pass {
            position: absolute;
            right: 14px;
            font-size: 19px;
            color: #7b8a82;
            cursor: pointer;
        }

        .dual-fields {
            display: grid;
            grid-template-columns: 1fr 1.35fr;
            gap: 10px;
        }
        .dual-fields .input-box input {
            padding-left: 12px;
            padding-right: 10px;
            font-size: 13px;
        }

        /* 4 Digit OTP Inputs */
        .otp-container {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 14px;
        }
        .otp-input {
            width: 22%;
            height: 52px;
            text-align: center;
            font-size: 24px;
            font-weight: 800;
            border: 1.5px solid #d4ded8;
            border-radius: 14px;
            outline: none;
            color: #0d5c3a;
            background: #fafdfb;
        }
        .otp-input:focus {
            border-color: #0e8345;
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(14, 131, 69, 0.12);
        }

        /* Buttons */
        .btn-primary {
            width: 100%;
            height: 49px;
            background: #0e8345;
            color: #ffffff;
            border: none;
            border-radius: 14px;
            font-size: 14.5px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            box-shadow: 0 6px 18px rgba(14, 131, 69, 0.22);
            transition: all 0.2s;
        }
        .btn-primary:active {
            transform: scale(0.98);
        }
        .btn-primary:disabled {
            background: #b5d5c4 !important;
            box-shadow: none !important;
            cursor: not-allowed;
            opacity: 0.85;
        }

        .extra-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 12px 0 18px;
            font-size: 12.5px;
        }
        .security-badge {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin-top: 14px;
            color: #7b8a82;
            font-size: 11.5px;
            font-weight: 600;
        }
        .security-badge i {
            font-size: 16px;
            color: #0e8345;
        }
    </style>
</head>
<body>

    <div class="auth-card">
        <!-- Floating Notifications -->
        <div id="toast" class="toast-notify">
            <i id="toast-icon" class="ph-fill ph-check-circle" style="font-size:18px;"></i>
            <span id="toast-text"></span>
        </div>

        <div>
            <!-- Header -->
            <div class="brand-header">
                <div class="brand-logo"><i class="ph-fill ph-leaf"></i></div>
                <div class="brand-info">
                    <h2>Roxen</h2>
                    <p>FRESHNESS FOR EVERY DAY</p>
                </div>
            </div>

            <p class="badge-sub">YOUR FRESH START</p>
            <h1 class="title" id="page-title">Join Roxen.</h1>
            <p class="desc" id="page-desc">Create your account with email OTP.</p>

            <!-- Pill Navigation -->
            <div class="segmented-control">
                <button type="button" class="seg-btn" id="tab-signin" onclick="switchTab('signin')">Sign In</button>
                <button type="button" class="seg-btn active" id="tab-signup" onclick="switchTab('signup')">Create Account</button>
            </div>

            <!-- 1. SIGN IN FORM -->
            <form id="form-signin" class="form-section" onsubmit="handleLogin(event)">
                <div class="field-group">
                    <label>EMAIL OR MOBILE NUMBER</label>
                    <div class="input-box">
                        <i class="ph ph-user lead-icon"></i>
                        <input type="text" id="login-identifier" placeholder="Enter email or mobile" required>
                    </div>
                </div>

                <div class="field-group">
                    <label>PASSWORD</label>
                    <div class="input-box">
                        <i class="ph ph-lock-key lead-icon"></i>
                        <input type="password" id="login-pass" placeholder="Enter your password" required>
                        <i class="ph ph-eye toggle-pass" onclick="togglePass('login-pass', this)"></i>
                    </div>
                </div>

                <div class="extra-row">
                    <label style="display:flex; align-items:center; gap:6px; color:#5b6963; cursor:pointer;">
                        <input type="checkbox" style="accent-color:#0e8345;"> Remember me
                    </label>
                    <a href="#" style="color:#0e8345; font-weight:700; text-decoration:none;">Forgot password?</a>
                </div>

                <button type="submit" id="btn-login" class="btn-primary">
                    <span>Sign In Securely</span> <i class="ph-bold ph-arrow-right"></i>
                </button>
            </form>

            <!-- 2. CREATE ACCOUNT WITH OTP -->
            <div id="form-signup" class="form-section active">
                <div id="reg-step-1">
                    <div class="field-group">
                        <label>FULL NAME</label>
                        <div class="input-box">
                            <i class="ph ph-user lead-icon"></i>
                            <input type="text" id="reg-fullname" placeholder="Your full name" onkeyup="checkInputValidation()" oninput="checkInputValidation()">
                        </div>
                    </div>

                    <div class="field-group">
                        <div class="dual-fields">
                            <div>
                                <label>MOBILE</label>
                                <div class="input-box">
                                    <input type="tel" id="reg-mobile" placeholder="10 digits" maxlength="10" oninput="this.value = this.value.replace(/[^0-9]/g, ''); checkInputValidation()">
                                </div>
                            </div>
                            <div>
                                <label>EMAIL ADDRESS</label>
                                <div class="input-box">
                                    <input type="email" id="reg-email" placeholder="you@email.com" onkeyup="checkInputValidation()" oninput="checkInputValidation()">
                                </div>
                            </div>
                        </div>
                    </div>

                    <button type="button" id="btn-send-otp" class="btn-primary" onclick="sendOtp()" disabled style="margin-top:8px;">
                        <span>Send 4-Digit OTP</span> <i class="ph-bold ph-paper-plane-tilt"></i>
                    </button>
                </div>

                <!-- OTP & Password Verification Section -->
                <div id="reg-step-2" style="display: none;">
                    <div class="field-group">
                        <label>ENTER 4-DIGIT EMAIL OTP</label>
                        <div class="otp-container">
                            <input type="text" class="otp-input" maxlength="1" oninput="moveToNext(this, 0)">
                            <input type="text" class="otp-input" maxlength="1" oninput="moveToNext(this, 1)">
                            <input type="text" class="otp-input" maxlength="1" oninput="moveToNext(this, 2)">
                            <input type="text" class="otp-input" maxlength="1" oninput="moveToNext(this, 3)">
                        </div>
                    </div>

                    <div class="field-group">
                        <label>CREATE PASSWORD</label>
                        <div class="input-box">
                            <i class="ph ph-lock-key lead-icon"></i>
                            <input type="password" id="reg-pass" placeholder="Create your password" oninput="checkOtpStepValidation()">
                            <i class="ph ph-eye toggle-pass" onclick="togglePass('reg-pass', this)"></i>
                        </div>
                    </div>

                    <button type="button" id="btn-verify-otp" class="btn-primary" onclick="verifyOtpAndRegister()" disabled>
                        <span>Verify & Create Account</span> <i class="ph-bold ph-check-circle"></i>
                    </button>
                </div>
            </div>

            <div class="security-badge">
                <i class="ph-fill ph-shield-check"></i>
                <span>Keep your password and OTP private</span>
            </div>
        </div>

        <p style="text-align:center; font-size:10.5px; color:#95a39c; margin-top:14px;">© 2026 Roxen. All rights reserved.</p>
    </div>

    <script>
        function showToast(text, type='success') {
            const toast = document.getElementById('toast');
            const toastText = document.getElementById('toast-text');
            const toastIcon = document.getElementById('toast-icon');
            toast.className = `toast-notify ${type}`;
            toastText.innerText = text;
            toastIcon.className = (type === 'success') ? "ph-fill ph-check-circle" : "ph-fill ph-warning-circle";
            toast.style.display = 'flex';
            setTimeout(() => { toast.style.display = 'none'; }, 3800);
        }

        function switchTab(tab) {
            const signinBtn = document.getElementById('tab-signin');
            const signupBtn = document.getElementById('tab-signup');
            const formSignin = document.getElementById('form-signin');
            const formSignup = document.getElementById('form-signup');
            const title = document.getElementById('page-title');
            const desc = document.getElementById('page-desc');

            if (tab === 'signin') {
                signinBtn.classList.add('active');
                signupBtn.classList.remove('active');
                formSignin.classList.add('active');
                formSignup.classList.remove('active');
                title.innerText = 'Welcome back.';
                desc.innerText = 'Sign in to continue your shopping journey.';
            } else {
                signupBtn.classList.add('active');
                signinBtn.classList.remove('active');
                formSignup.classList.add('active');
                formSignin.classList.remove('active');
                title.innerText = 'Join Roxen.';
                desc.innerText = 'Create your account with email OTP.';
            }
        }

        function togglePass(inputId, icon) {
            const input = document.getElementById(inputId);
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.replace('ph-eye', 'ph-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.replace('ph-eye-slash', 'ph-eye');
            }
        }

        // Live validation without bugs
        function checkInputValidation() {
            const name = document.getElementById('reg-fullname').value.trim();
            const mobile = document.getElementById('reg-mobile').value.trim();
            const email = document.getElementById('reg-email').value.trim();
            const btn = document.getElementById('btn-send-otp');

            const hasValidName = name.length >= 2;
            const hasValidMobile = mobile.length === 10;
            const hasValidEmail = email.includes('@') && email.includes('.');

            if (hasValidName && hasValidMobile && hasValidEmail) {
                btn.removeAttribute('disabled');
            } else {
                btn.setAttribute('disabled', 'true');
            }
        }

        function moveToNext(current, index) {
            current.value = current.value.replace(/[^0-9]/g, '');
            if (current.value.length === 1 && index < 3) {
                document.querySelectorAll('.otp-input')[index + 1].focus();
            }
            checkOtpStepValidation();
        }

        function checkOtpStepValidation() {
            let enteredOtp = '';
            document.querySelectorAll('.otp-input').forEach(i => enteredOtp += i.value);
            const pass = document.getElementById('reg-pass').value.trim();
            const btn = document.getElementById('btn-verify-otp');

            if (enteredOtp.length === 4 && pass.length >= 6) {
                btn.removeAttribute('disabled');
            } else {
                btn.setAttribute('disabled', 'true');
            }
        }

        function sendOtp() {
            const email = document.getElementById('reg-email').value.trim();
            const btn = document.getElementById('btn-send-otp');

            btn.setAttribute('disabled', 'true');
            btn.innerHTML = `Sending OTP... <i class="ph-bold ph-spinner ph-spin"></i>`;

            fetch('/api/send-otp', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: email })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    showToast("4-digit code sent to your email!", "success");
                    document.getElementById('reg-step-1').style.display = 'none';
                    document.getElementById('reg-step-2').style.display = 'block';
                    document.querySelectorAll('.otp-input')[0].focus();
                } else {
                    showToast(data.error || "Failed to send OTP", "error");
                    btn.removeAttribute('disabled');
                    btn.innerHTML = `<span>Send 4-Digit OTP</span> <i class="ph-bold ph-paper-plane-tilt"></i>`;
                }
            })
            .catch(() => {
                showToast("Connection issue! Please check if server is active.", "error");
                btn.removeAttribute('disabled');
                btn.innerHTML = `<span>Send 4-Digit OTP</span> <i class="ph-bold ph-paper-plane-tilt"></i>`;
            });
        }

        function verifyOtpAndRegister() {
            let enteredOtp = '';
            document.querySelectorAll('.otp-input').forEach(i => enteredOtp += i.value);

            const password = document.getElementById('reg-pass').value.trim();
            const email = document.getElementById('reg-email').value.trim();
            const mobile = document.getElementById('reg-mobile').value.trim();
            const fullname = document.getElementById('reg-fullname').value.trim();
            const btn = document.getElementById('btn-verify-otp');

            btn.setAttribute('disabled', 'true');
            btn.innerHTML = `Creating Account... <i class="ph-bold ph-spinner ph-spin"></i>`;

            fetch('/api/verify-register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    fullname: fullname,
                    mobile: mobile,
                    email: email,
                    otp: enteredOtp,
                    password: password
                })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    showToast("Account created! Please sign in now.", "success");
                    setTimeout(() => {
                        switchTab('signin');
                        document.getElementById('login-identifier').value = email || mobile;
                        document.getElementById('login-pass').focus();
                        btn.removeAttribute('disabled');
                        btn.innerHTML = `<span>Verify & Create Account</span> <i class="ph-bold ph-check-circle"></i>`;
                    }, 1200);
                } else {
                    showToast(data.error || "Invalid OTP code. Try again.", "error");
                    btn.removeAttribute('disabled');
                    btn.innerHTML = `<span>Verify & Create Account</span> <i class="ph-bold ph-check-circle"></i>`;
                }
            })
            .catch(() => {
                showToast("Server error during verification.", "error");
                btn.removeAttribute('disabled');
                btn.innerHTML = `<span>Verify & Create Account</span> <i class="ph-bold ph-check-circle"></i>`;
            });
        }

        function handleLogin(e) {
            e.preventDefault();
            const identifier = document.getElementById('login-identifier').value.trim();
            const password = document.getElementById('login-pass').value.trim();
            const btn = document.getElementById('btn-login');

            btn.setAttribute('disabled', 'true');
            btn.innerHTML = `Signing In... <i class="ph-bold ph-spinner ph-spin"></i>`;

            fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ identifier: identifier, password: password })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    showToast("Login successful! Redirecting...", "success");
                    setTimeout(() => { window.location.href = data.redirect; }, 800);
                } else {
                    showToast(data.error || "Invalid mobile/email or password.", "error");
                    btn.removeAttribute('disabled');
                    btn.innerHTML = `<span>Sign In Securely</span> <i class="ph-bold ph-arrow-right"></i>`;
                }
            })
            .catch(() => {
                showToast("Connection error. Try again.", "error");
                btn.removeAttribute('disabled');
                btn.innerHTML = `<span>Sign In Securely</span> <i class="ph-bold ph-arrow-right"></i>`;
            });
        }
    </script>
</body>
</html>
